<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="支持章节筛选、随机抽题和即时判题的课程题库练习工具。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/site-base.css">
<title id="pageTitle">题库练习</title>

<link rel="stylesheet" href="assets/css/quiz.css">
</head>
<body>
<div class="c">
<a class="page-back" href="index.html">← 返回学习小站</a>
<div class="h"><h1 id="quizTitle">题库练习</h1><p id="quizSubtitle">加载中...</p></div>
<div class="ct">
<label>章节</label><select id="cf"><option value="all">全部</option></select>
<label>题型</label><select id="tf"><option value="all">全部</option></select>
<label>数量</label><input type="number" id="ci" value="10" min="1" max="999" style="width:60px">
<button class="bt bt-p" onclick="drawQuestions()">🎲 抽题</button>
<button class="bt bt-o" id="wrongBookButton" onclick="startWrongPractice()">错题本（0）</button>
<button class="bt bt-o" onclick="resetQuiz()">🔄 重置</button>
<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.85em;color:#666;white-space:nowrap"><input type="checkbox" id="sfCb" style="width:auto;margin:0">🔀 选项乱序</label>
</div>
<div class="cm" id="cm">
<button type="button" class="cmt" onclick="toggleChapterPanel()">📋 多选章节 ▸</button>
<div class="cmp" id="cmp" style="display:none">
<button type="button" class="cpl" onclick="selectAllChapters()">全选</button><button type="button" class="cpl" onclick="deselectAllChapters()">清除</button>
<div class="cml" id="cml"></div>
</div>
</div>
<div class="save-bar" id="saveBar" aria-live="polite">
<span id="saveStatus">答题进度会自动保存在当前浏览器</span>
<button type="button" class="text-button" onclick="clearSavedProgress()">清除进度</button>
<button type="button" class="text-button danger-text" id="clearWrongButton" onclick="clearWrongBook()" disabled>清空错题</button>
</div>
<div class="st">
<div class="si"><div class="sn" id="st">0</div><div class="sl">题数</div></div>
<div class="si"><div class="sn" id="sd">0</div><div class="sl">已做</div></div>
<div class="si"><div class="sn" id="sc">0</div><div class="sl">正确</div></div>
<div class="si"><div class="sn" id="sa">-</div><div class="sl">正确率</div></div>
<div class="si"><div class="sn" id="sr">0</div><div class="sl">剩余</div></div>
</div>
<div id="qa"><div class="em"><p>👆 选择条件，点击「抽题」开始</p><p class="ec" id="totalInfo"></p></div></div>
<div class="ab" id="ab" style="display:none">
<button class="bt bt-o" id="prevButton" onclick="prevQuestion()">⬅ 上一题</button>
<button class="bt bt-p" id="nextButton" onclick="nextQuestion()">下一题 ➡</button>
<button class="bt bt-d mobile-secondary" onclick="resetQuiz()">🔄 重新抽题</button>
</div>
</div>
<script src="assets/js/quiz.js"></script>
</body>
</html>

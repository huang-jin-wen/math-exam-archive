<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title id="pageTitle">题库练习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;min-height:100vh;-webkit-font-smoothing:antialiased}
.c{max-width:640px;margin:0 auto;padding:20px}
.h{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 16px;border-radius:14px;margin-bottom:20px;text-align:center;box-shadow:0 4px 16px rgba(102,126,234,.2)}
.h h1{font-size:1.5em;margin-bottom:6px}
.h p{opacity:.85;font-size:.9em}
.ct{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #eef0f2}
.ct label{font-size:.85em;color:#666;white-space:nowrap}
.ct select,.ct input{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:.9em;background:#fff}
.ct select{min-width:160px;max-width:220px}
.ct select:focus,.ct input:focus{outline:none;border-color:#667eea}
.bt{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;font-size:.9em;font-weight:500;transition:all .15s ease;white-space:nowrap}
.bt:active{transform:scale(.97)}
.bt-p{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.25)}.bt-p:hover{opacity:.9;box-shadow:0 4px 12px rgba(102,126,234,.35)}
.bt-o{background:#fff;color:#667eea;border:1px solid #667eea}.bt-o:hover{background:#f5f3ff}
.bt-s{background:#52c41a;color:#fff;box-shadow:0 2px 6px rgba(82,196,26,.2)}.bt-s:hover{opacity:.9}
.bt-d{background:#ff4d4f;color:#fff;box-shadow:0 2px 6px rgba(255,77,79,.2)}.bt-d:hover{opacity:.9}
.st{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #eef0f2}
.si{text-align:center}.sn{font-size:1.5em;font-weight:700;color:#667eea}.sl{font-size:.78em;color:#999;margin-top:2px}
.qc{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #eef0f2;margin-bottom:16px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.qb{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.8em;font-weight:500}
.bs{background:#e6f7ff;color:#1890ff}.bm{background:#fff7e6;color:#fa8c16}.bf{background:#f0f5ff;color:#722ed1}.bj{background:#f6ffed;color:#52c41a}
.qp{font-size:.8em;color:#999}
.qs{font-size:1.05em;line-height:1.7;margin-bottom:20px;color:#1a1a1a}
.op{display:flex;flex-direction:column;gap:10px}
.oi{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:2px solid #e8ecf1;border-radius:10px;cursor:pointer;transition:all .18s ease}
.oi:hover{border-color:#c4c9d4;background:#fafbfc}

.ol{width:32px;height:32px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.9em;flex-shrink:0;transition:all .18s ease}
.oi.sel .ol{background:#667eea;color:#fff;box-shadow:0 2px 6px rgba(102,126,234,.3)}.oi.ok .ol{background:#52c41a;color:#fff}.oi.er .ol{background:#ff4d4f;color:#fff}
.ot{line-height:1.6;padding-top:4px;flex:1}
.jo{display:flex;gap:16px}
.jb{flex:1;padding:14px;border:2px solid #e8ecf1;border-radius:10px;text-align:center;cursor:pointer;font-size:1.1em;font-weight:600;transition:all .18s ease}
.jb:hover{border-color:#c4c9d4;background:#fafbfc}
.jb:active{background:#f0f0ff;transform:scale(.98)}.jb.sel{border-color:#667eea;background:#f0f0ff;box-shadow:0 0 0 1px rgba(102,126,234,.15)}
.jb.ok{border-color:#52c41a;background:#f6ffed}.jb.er{border-color:#ff4d4f;background:#fff2f0}.jb.di{pointer-events:none}
.sb{margin-top:16px;text-align:center}
.fb{margin-top:16px;padding:14px 18px;border-radius:10px;display:none;line-height:1.7;animation:fi .3s ease}
.fb.sh{display:block}.fc{background:#f6ffed;border:1px solid #b7eb8f;color:#2d6a1e}.fi{background:#fff2f0;border:1px solid #ffccc7;color:#8c1c13}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ab{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.em{text-align:center;padding:60px 20px;color:#999}.em p{font-size:.95em}.em .ec{font-size:.8em;color:#bbb;margin-top:8px}
.cm{background:#fff;border-radius:14px;padding:10px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #eef0f2}

@media(max-width:600px){.c{padding:10px}.ct{flex-direction:column;align-items:stretch}.ct select,.ct input{width:100%}.bt{width:100%}.jo{flex-direction:column}}

.fi-inp:disabled{background:#f0f0f0;color:#666}
.fi-mk{display:inline-block;min-width:32px;text-align:center;border-bottom:2px solid #667eea;margin:0 3px;color:#667eea;font-weight:600;font-size:.9em;padding:0 2px}
.fi-row{margin-top:16px;padding:12px 16px;background:#f8f9fc;border-radius:8px;border:1px solid #e8ecf1}
.fi-row-tip{font-size:.82em;color:#667eea;margin-bottom:10px;font-weight:500}
.fi-row-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.fi-fb-user{margin:10px 0 4px;padding:10px 12px;background:#fff5f5;border-radius:6px;border-left:3px solid #ff4d4f}

.fi-fb-n{color:#888;min-width:44px;font-size:.85em}

.fi-fb-v.ok{color:#52c41a}
.fi-fb-v.er{color:#ff4d4f}

/* ===== 代码块 ===== */
.code-block{background:#f4f6f9;color:#334155;border-radius:8px;padding:12px 16px;margin:10px 0;font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;font-size:.85em;line-height:1.7;overflow-x:auto;white-space:pre-wrap;word-break:break-word;border:1px solid #e2e8f0}

.code-block .fn{color:#2563eb}
.code-block .str{color:#059669}

.oc{background:#f4f6f9;border-radius:6px;padding:6px 10px;margin:4px 0;font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;font-size:.82em;line-height:1.7;overflow-x:auto;white-space:pre-wrap;word-break:break-word;border:1px solid #e2e8f0}
.oc code{display:block}
.oc .kw{color:#7c3aed}
.oc .fn{color:#2563eb}
.oc .str{color:#059669}
.oc .num{color:#d97706}
.oc .cm{color:#94a3b8;font-style:italic}
.code-inline{background:#f1f5f9;color:#334155;padding:2px 6px;border-radius:4px;font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;font-size:.9em}
</style>
</head>
<body>
<div class="c">
<div class="h"><h1 id="quizTitle">题库练习</h1><p id="quizSubtitle">加载中...</p></div>
<div class="ct">
<label>章节</label><select id="cf"><option value="all">全部</option></select>
<label>题型</label><select id="tf"><option value="all">全部</option></select>
<label>数量</label><input type="number" id="ci" value="10" min="1" max="999" style="width:60px">
<button class="bt bt-p" onclick="drawQuestions()">🎲 抽题</button>
<button class="bt bt-o" onclick="resetQuiz()">🔄 重置</button>
<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.85em;color:#666;white-space:nowrap"><input type="checkbox" id="sfCb" style="width:auto;margin:0">🔀 选项乱序</label>
</div>
<div class="cm" id="cm">
<span class="cmt" onclick="toggleChapterPanel()">📋 多选章节 ▸</span>
<div class="cmp" id="cmp" style="display:none">
<span class="cpl" onclick="selectAllChapters()">全选</span><span class="cpl" onclick="deselectAllChapters()">清除</span>
<div class="cml" id="cml"></div>
</div>
</div>
<div class="st">
<div class="si"><div class="sn" id="st">0</div><div class="sl">题数</div></div>
<div class="si"><div class="sn" id="sd">0</div><div class="sl">已做</div></div>
<div class="si"><div class="sn" id="sc">0</div><div class="sl">正确</div></div>
<div class="si"><div class="sn" id="sa">-</div><div class="sl">正确率</div></div>
<div class="si"><div class="sn" id="sr">0</div><div class="sl">剩余</div></div>
</div>
<div id="qa"><div class="em"><p>👆 选择条件，点击「抽题」开始</p><p class="ec" id="totalInfo"></p></div></div>
<div class="ab" id="ab" style="display:none">
<button class="bt bt-o" onclick="prevQuestion()">⬅ 上一题</button>
<button class="bt bt-p" onclick="nextQuestion()">下一题 ➡</button>
<button class="bt bt-d" onclick="resetQuiz()">🔄 重新抽题</button>
</div>
</div>
<script>
/* ===== 全局状态 ===== */
let allQuestions = [];      // 全部题目
let questionPool = [];      // 当前抽题池
let currentIndex = 0;       // 当前题号
let userAnswers = {};       // 用户答案 {idx: answer}
let questionAnswered = {};  // 是否已判卷 {idx: true}
let multiSelectState = {};  // 多选题暂存 {idx: {label: 1}}

/* ===== 科目副标题映射 ===== */
const SUBTITLE_MAP = {
  '创业导论': '复旦大学 · 题库随机练习',
  '舞蹈鉴赏': '北京舞蹈学院 · 题库随机练习',
  '中国书法史': '南开大学 · 超星尔雅 · 题库随机练习',
  '大学英语词汇': '词汇选择题 · 题库随机练习',
  'Python题库': 'Python语言 · 题库随机练习'
};

/* ===== 加载数据 ===== */
const params = new URLSearchParams(window.location.search);
const subject = params.get('subject');

if (!subject) {
  getEl('qa').innerHTML = '<div class="em"><p>请通过导航页选择科目</p></div>';
} else {
  fetch('data/' + subject + '.json')
    .then(r => r.json())
    .then(data => {
      allQuestions = data;
      getEl('quizTitle').textContent = subject;
      getEl('pageTitle').textContent = subject + ' - 题库练习';
      getEl('quizSubtitle').textContent = SUBTITLE_MAP[subject] || '题库随机练习';
      getEl('totalInfo').textContent = '题库共 ' + allQuestions.length + ' 题';
      buildChapterUI();
    })
    .catch(() => {
      getEl('qa').innerHTML = '<div class="em"><p>加载失败：' + subject + '</p></div>';
    });
}

function getEl(id) { return document.getElementById(id); }

/* ===== 获取题目的分组键：Python 按知识点，其他科目按章节编号 ===== */
function getChapterKey(q) {
  return (subject === 'Python题库') ? (q.chapter_title || q.chapter) : q.chapter;
}

/* ===== 章节 UI ===== */
function buildChapterUI() {
  const isPython = subject === 'Python题库';
  const chapters = [...new Set(allQuestions.map(q => getChapterKey(q)))]
      .sort((a, b) => {
        const aTest = String(a).includes('自测'), bTest = String(b).includes('自测');
        if (aTest && !bTest) return 1;
        if (!aTest && bTest) return -1;
        return String(a).localeCompare(String(b), undefined, {numeric: true});
      });

  const cf = getEl('cf'), cml = getEl('cml');
  chapters.forEach(ch => {
    const opt = document.createElement('option');
    opt.value = ch;
    const count = allQuestions.filter(q => getChapterKey(q) === ch).length;
    const q = allQuestions.find(q => getChapterKey(q) === ch);
    const display = isPython
      ? ch + ' (' + count + '题)'
      : ch + (q && q.chapter_title ? ' ' + q.chapter_title : '') + ' (' + count + '题)';
    opt.textContent = display;
    cf.appendChild(opt);

    const chip = document.createElement('span');
    chip.className = 'chi';
    chip.textContent = ch;
    chip.title = display;
    chip.onclick = function() { this.classList.toggle('ck'); updateChapterLabel(); };
    cml.appendChild(chip);
  });

  // 动态生成题型选项
  const types = [...new Set(allQuestions.map(q => q.type))];
  const tf = getEl('tf');
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    tf.appendChild(opt);
  });
}

/* ===== 章节多选 ===== */
function toggleChapterPanel() {
  const panel = getEl('cmp');
  const toggle = document.querySelector('.cmt');
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  toggle.innerHTML = isOpen ? '📋 多选章节 ▸' : '📋 多选章节 ▾';
}

function selectAllChapters() {
  document.querySelectorAll('.chi').forEach(c => c.classList.add('ck'));
  updateChapterLabel();
}

function deselectAllChapters() {
  document.querySelectorAll('.chi').forEach(c => c.classList.remove('ck'));
  updateChapterLabel();
}

function updateChapterLabel() {
  const n = document.querySelectorAll('.chi.ck').length;
  const toggle = document.querySelector('.cmt');
  toggle.innerHTML = n > 0 ? '📋 多选章节 (' + n + '个) ▸' : '📋 多选章节 ▸';
}

function getSelectedChapters() {
  const chips = document.querySelectorAll('.chi.ck');
  if (chips.length === 0) return null;
  return Array.from(chips).map(c => c.textContent);
}

/* ===== Fisher-Yates 洗牌 ===== */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ===== 乱序选项 ===== */
function shuffleOptions(questions) {
  for (const q of questions) {
    if (q.type === '判断题' || q.type === '填空题') continue;
    const texts = q.options.map(o => o.text);
    // Fisher-Yates on texts
    for (let i = texts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [texts[i], texts[j]] = [texts[j], texts[i]];
    }
    const labels = q.options.map(o => o.label);
    const noteMap = {};
    q.options.forEach(o => { noteMap[o.text] = o.note; });

    const newOpts = labels.map((lbl, k) => ({ label: lbl, text: texts[k], note: noteMap[texts[k]] || '' }));

    // Remap answer labels
    const oldAnswerLabels = q.answer.split('');
    const correctTexts = [];
    for (const o of q.options) {
      if (oldAnswerLabels.includes(o.label)) correctTexts.push(o.text);
    }
    const newAnswerLabels = [];
    for (const t of correctTexts) {
      const match = newOpts.find(o => o.text === t);
      if (match) newAnswerLabels.push(match.label);
    }

    q.options = newOpts;
    q.answer = newAnswerLabels.sort().join('') || q.answer;
  }
  return questions;
}

/* ===== 抽题 ===== */
function drawQuestions() {
  const chapter = getEl('cf').value;
  const type = getEl('tf').value;
  const count = parseInt(getEl('ci').value) || 10;

  let pool = allQuestions.slice();
  const selChapters = getSelectedChapters();
  if (selChapters) {
    pool = pool.filter(q => selChapters.includes(getChapterKey(q)));
  } else if (chapter !== 'all') {
    pool = pool.filter(q => getChapterKey(q) === chapter);
  }
  if (type !== 'all') pool = pool.filter(q => q.type === type);

  if (!pool.length) { alert('无符合条件题目'); return; }

  const n = Math.min(count, pool.length);
  questionPool = shuffle(pool).slice(0, n);

  if (getEl('sfCb').checked) shuffleOptions(questionPool);

  currentIndex = 0;
  userAnswers = {};
  questionAnswered = {};
  multiSelectState = {};
  updateStats();
  renderQuestion();
  getEl('ab').style.display = 'flex';
}

/* ===== 重置 ===== */
function resetQuiz() {
  questionPool = [];
  currentIndex = 0;
  userAnswers = {};
  questionAnswered = {};
  multiSelectState = {};
  getEl('qa').innerHTML = '<div class="em"><p>👆 选择条件，点击「抽题」开始</p><p class="ec">题库共 ' + allQuestions.length + ' 题</p></div>';
  getEl('ab').style.display = 'none';
  updateStats();
}

/* ===== 判题逻辑 ===== */
function checkAnswer(idx) {
  const ua = userAnswers[idx];
  const q = questionPool[idx];
  if (!ua || !q) return false;
  if (q.type === '多选题') {
    return ua.split('').sort().join('') === q.answer.split('').sort().join('');
  }
  if (q.type === '填空题') {
    // 统一分隔符：| → ; 再去空白比较
    return ua.toLowerCase().replace(/\s/g, '').replace(/\|/g, ';') === q.answer.toLowerCase().replace(/\s/g, '').replace(/\|/g, ';');
  }
  return ua === q.answer;
}

/* ===== 更新统计 ===== */
function updateStats() {
  const total = questionPool.length;
  const done = Object.keys(userAnswers).length;
  let correct = 0;
  Object.keys(userAnswers).forEach(i => {
    if (checkAnswer(parseInt(i))) correct++;
  });
  getEl('st').textContent = total;
  getEl('sd').textContent = done;
  getEl('sc').textContent = correct;
  getEl('sa').textContent = done > 0 ? Math.round(correct / done * 100) + '%' : '-';
  getEl('sr').textContent = total - done;
}

/* ===== 答题 ===== */
function answerQuestion(i, value) {
  if (i in questionAnswered) return;
  const q = questionPool[i];

  if (q.type === '多选题') {
    if (!multiSelectState[i]) multiSelectState[i] = {};
    if (multiSelectState[i][value]) {
      delete multiSelectState[i][value];
    } else {
      multiSelectState[i][value] = 1;
    }
    renderQuestion();
    return;
  }

  userAnswers[i] = value;
  questionAnswered[i] = true;
  renderQuestion();
  updateStats();
}

function submitFillIn(i) {
  if (i in questionAnswered) return;
  const q = questionPool[i];
  const blankCount = getFillInBlankCount(q);
  const vals = [];
  for (let j = 0; j < blankCount; j++) {
    const el = getEl('fb' + i + '_' + j);
    vals.push(el ? el.value.trim() : '');
  }
  userAnswers[i] = vals.join('|');
  questionAnswered[i] = true;
  renderQuestion();
  updateStats();
}

function submitMulti(i) {
  if (i in questionAnswered) return;
  const sel = multiSelectState[i] || {};
  const keys = Object.keys(sel).sort();
  userAnswers[i] = keys.join('');
  questionAnswered[i] = true;
  renderQuestion();
  updateStats();
}

/* ===== 填空题辅助 ===== */
function getFillInBlankCount(q) {
  const blankSet = new Set();
  q.stem.replace(/【(\d+)】/g, (m, n) => { blankSet.add(parseInt(n)); return m; });
  return blankSet.size || (q.answer ? q.answer.split('|').length : 1);
}

/* ===== 渲染题目 ===== */
function renderQuestion() {
  if (!questionPool.length) return;
  const q = questionPool[currentIndex];
  const i = currentIndex;
  const answered = i in questionAnswered;

  // 题型 badge 颜色
  const typeClass = q.type === '单选题' ? 'bs' : q.type === '多选题' ? 'bm' : q.type === '填空题' ? 'bf' : 'bj';

  // 渲染选项区域
  let stemHTML = '';
  let optionHTML = '';
  if (q.type === '判断题') {
    optionHTML = renderTrueFalse(i, answered);
  } else if (q.type === '填空题') {
    const fi = renderFillIn(i, answered);
    stemHTML = fi.stem;
    optionHTML = fi.inputs;
  } else {
    optionHTML = renderOptions(i, answered);
  }

  // 多选提交按钮
  if (q.type === '多选题' && !answered) {
    const sel = multiSelectState[i] || {};
    const keys = Object.keys(sel);
    optionHTML += '<div class="sb"><button type="button" class="bt bt-s" onclick="submitMulti(' + i + ')"' +
      (keys.length === 0 ? ' disabled style="opacity:.5"' : '') +
      '>💬 提交答案</button></div>';
  }

  // 填空题提交按钮
  if (q.type === '填空题' && !answered) {
    optionHTML += '<div class="sb"><button type="button" class="bt bt-s" onclick="submitFillIn(' + i + ')">✉ 提交答案</button></div>';
  }

  // 反馈区域
  let feedbackHTML = '';
  if (answered) {
    const ua = userAnswers[i] || '';
    const ok = checkAnswer(i);
    const fbClass = ok ? 'fc' : 'fi';
    const icon = ok ? '✅ 回答正确！' : '❌ 回答错误';

    if (q.type === '填空题') {
      const correctParts = q.answer.split('|');
      const userParts = ua.split('|');
      feedbackHTML = '<div class="fb sh ' + fbClass + '"><strong>' + icon + '</strong>';

      // 错误时显示你的答案 vs 正确答案 逐空对比
      if (!ok) {
        feedbackHTML += '<div class="fi-fb-user">';
        feedbackHTML += '<div class="fi-fb-label">你的答案</div>';
        correctParts.forEach((cv, j) => {
          const uv = userParts[j] || '(未填)';
          const eq = uv.toLowerCase().replace(/\s/g, '') === cv.toLowerCase().replace(/\s/g, '');
          feedbackHTML += '<div class="fi-fb-item"><span class="fi-fb-n">第' + (j + 1) + '空</span>' +
            '<span class="fi-fb-v ' + (eq ? 'ok' : 'er') + '">' + escapeHTML(uv) + '</span>' +
            (eq ? ' ✅' : ' ❌ → ' + escapeHTML(cv)) +
            '</div>';
        });
        feedbackHTML += '</div>';
      }

      // 正确答案（始终显示）
      feedbackHTML += '<div class="fi-fb-correct">';
      feedbackHTML += '<div class="fi-fb-label" style="color:#52c41a">正确答案</div>';
      correctParts.forEach((cv, j) => {
        feedbackHTML += '<div class="fi-fb-item"><span class="fi-fb-n">第' + (j + 1) + '空</span>' +
          '<span class="fi-fb-v ok">' + escapeHTML(cv) + '</span></div>';
      });
      feedbackHTML += '</div>';
    } else {
      const yourAnswer = ok ? '' : '你的答案：<b>' + escapeHTML(ua) + '</b><br>';
      feedbackHTML = '<div class="fb sh ' + fbClass + '"><strong>' + icon + '</strong><br>' +
        yourAnswer + '正确答案：<b>' + escapeHTML(q.answer) + '</b>';
    }

    if (q.type === '判断题') {
      feedbackHTML += ' (' + (q.answer === '√' ? '正确' : '错误') + ')';
    }
    if (q.trans) {
      feedbackHTML += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e8e8e8;color:#666;font-size:.95em"><strong>🌍 整句翻译：</strong>' + escapeHTML(q.trans) + '</div>';
    }
    if (q.explanation) {
      feedbackHTML += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e8e8e8"><div style="font-weight:600;color:#667eea;margin-bottom:4px;font-size:.9em">📖 解析</div><div style="color:#555;line-height:1.7;font-size:.92em;white-space:pre-wrap">' + escapeHTML(q.explanation) + '</div></div>';
    }
    feedbackHTML += '</div>';
  }

  getEl('qa').innerHTML =
    '<div class="qc">' +
    '<div class="qh">' +
    '<span class="qb ' + typeClass + '">' + q.type + '</span>' +
    '<span class="qp">' + q.chapter + ' ' + q.chapter_title + ' · 第 ' + (i + 1) + '/' + questionPool.length + ' 题</span>' +
    '</div>' +
    (q.type === '填空题' ? stemHTML : '<div class="qs">' + renderStem(q.stem) + '</div>') +
    optionHTML + feedbackHTML +
    '</div>';

  updateStats();
}

/* ===== 判断题渲染 ===== */
function renderTrueFalse(i, answered) {
  const ua = userAnswers[i];
  const ca = questionPool[i].answer;
  const btnClass = v => {
    if (!answered) return ua === v ? 'sel' : '';
    if (v === ca) return 'ok';
    if (v === ua && ua !== ca) return 'er';
    return '';
  };
  const disabled = answered ? 'di' : '';
  return '<div class="jo">' +
    '<div class="jb ' + btnClass('√') + ' ' + disabled + '" onclick="answerQuestion(' + i + ',\'√\')">✅ 正确</div>' +
    '<div class="jb ' + btnClass('X') + ' ' + disabled + '" onclick="answerQuestion(' + i + ',\'X\')">❌ 错误</div>' +
    '</div>';
}

/* ===== 填空题渲染（题干+代码块 → 底部统一输入框） ===== */
function renderFillIn(i, answered) {
  const q = questionPool[i];
  const ua = userAnswers[i] || '';
  const parts = ua ? ua.split('|') : [];
  const stem = q.stem;

  // 确定空数量（去重【数字】编号）
  const blankCount = getFillInBlankCount(q);

  //【数字】→ 视觉占位标记
  const marker = (n) => '<span class="fi-mk">（' + n + '）</span>';

  // 检测代码块
  const hasCode = stem.includes('\n');
  let descHTML = '';
  let codeHTML = '';

  if (hasCode) {
    const lines = stem.split('\n');
    const rawDesc = lines[0];
    const rawCode = lines.slice(1).join('\n');

    descHTML = escapeHTML(rawDesc).replace(/【(\d+)】/g, (m, n) => marker(n));

    const indented = autoIndentPython(rawCode);
    const codeLines = indented.split('\n').map(l => {
      // 保护 【N】 占位符，防止数字高亮误匹配
      let line = l.replace(/【(\d+)】/g, '\x00B$1\x00');
      line = highlightPython(line);  // 内部已含 escapeHTML
      line = line.replace(/\x00B(\d+)\x00/g, (m, n) => marker(n));
      return line;
    }).join('\n');

    codeHTML = '<div class="code-block">' + codeLines + '</div>';
  } else {
    descHTML = escapeHTML(stem).replace(/【(\d+)】/g, (m, n) => marker(n));
  }

  // 题干区域
  const stemHTML = '<div class="qs">' + descHTML + codeHTML + '</div>';

  // 底部统一输入框
  let inputsHTML = '<div class="fi-row">';
  inputsHTML += '<div class="fi-row-tip">📝 作答区（共 ' + blankCount + ' 空）</div>';
  for (let j = 0; j < blankCount; j++) {
    const val = parts[j] || '';
    const dis = answered ? 'disabled' : '';
    inputsHTML += '<div class="fi-row-item">' +
      '<span class="fi-row-label">第' + (j + 1) + '空</span>' +
      '<input type="text" class="fi-inp" id="fb' + i + '_' + j +
      '" value="' + escapeAttr(val) + '" ' + dis + ' placeholder="请输入答案">' +
      '</div>';
  }
  inputsHTML += '</div>';

  return { stem: stemHTML, inputs: inputsHTML };
}

/* ===== 单选/多选渲染 ===== */
/* 选项文本渲染：检测 ; 分隔的代码并格式化 */
var PY_CODE_RE = /\b(def|for|while|if|print|open|import|return|class|with|try|except)\s*[:(]/;
function renderOptionText(text) {
  if (subject !== 'Python题库') return escapeHTML(text || '');
  if (!text) return escapeHTML(String(text));

  // \n 换行格式（预嵌缩进，跳过 autoIndentPython）
  if (text.includes('\n') && PY_CODE_RE.test(text)) {
    return '<div class="oc">' + text.split('\n').map(function(l) {
      return '<code>' + highlightPython(l) + '</code>';
    }).join('\n') + '</div>';
  }

  // ; 分隔格式（旧格式，需 autoIndentPython 推断缩进）
  if (!text.includes(';')) return escapeHTML(text);
  var parts = text.split(';');
  var hasCode = parts.some(function(p) { return PY_CODE_RE.test(p); });
  if (!hasCode) return escapeHTML(text);
  var rawCode = parts.map(function(l) { return l.trim(); }).join('\n');
  return '<div class="oc">' + autoIndentPython(rawCode).split('\n').map(function(l) {
    return '<code>' + highlightPython(l) + '</code>';
  }).join('\n') + '</div>';
}

function renderOptions(i, answered) {
  const q = questionPool[i];
  const ua = userAnswers[i] || '';
  const multiSel = multiSelectState[i] || {};
  const ca = q.answer;

  let html = '<div class="op">';
  q.options.forEach(o => {
    let cls = '';
    if (!answered) {
      if (q.type === '多选题') {
        if (multiSel[o.label]) cls = 'sel';
      } else {
        if (ua === o.label) cls = 'sel';
      }
    } else {
      if (q.type === '多选题') {
        if (ca.includes(o.label)) cls = 'ok';
        if (ua.includes(o.label) && !ca.includes(o.label)) cls = 'er';
      } else {
        if (o.label === ca) cls = 'ok';
        if (o.label === ua && o.label !== ca) cls = 'er';
      }
    }
    if (answered) cls += ' di';

    const click = answered ? '' : 'onclick="answerQuestion(' + i + ',\'' + o.label + '\')"';
    html += '<div class="oi ' + cls + '" ' + click + '>' +
      '<div class="ol">' + o.label + '</div>' +
      '<div class="ot">' + renderOptionText(o.text) +
      (answered && o.note ? ' <span style="color:#999;font-size:.9em">（' + escapeHTML(o.note) + '）</span>' : '') +
      '</div></div>';
  });
  html += '</div>';
  return html;
}

/* ===== 题干渲染（支持代码块） ===== */
function renderStem(stem) {
  if (subject !== 'Python题库') return escapeHTML(stem || '');
  if (!stem || typeof stem !== 'string') return escapeHTML(String(stem));

  // 用 ; 分隔的代码题模式：描述。; code1; code2
  const parts = stem.split(';');
  if (parts.length <= 1) {
    // 没有 ;，检查是否有 \n 实际换行（填空题代码块）
    if (stem.includes('\n')) {
      const segments = stem.split('\n');
      const desc = escapeHTML(segments[0]);
      const rawCode = segments.slice(1).join('\n');
      const code = autoIndentPython(rawCode).split('\n').map(l => highlightPython(l)).join('\n');
      if (code.trim()) {
        return desc + '<div class="code-block">' + code + '</div>';
      }
    }
    return escapeHTML(stem);
  }

  // 有 ; 分隔：第一段是描述，后面是代码行
  const desc = escapeHTML(parts[0].trim());
  const rawCode = parts.slice(1).map(l => l.trim()).join('\n');
  const codeLines = autoIndentPython(rawCode).split('\n').map(l => highlightPython(l)).join('\n');
  if (codeLines.trim()) {
    return desc + '<div class="code-block">' + codeLines + '</div>';
  }
  return escapeHTML(stem);
}

/* ===== 简单 Python 语法高亮（占位符架构：先标记→转义→替换，不交叉污染） ===== */
function highlightPython(code) {
  // 使用不可见控制字符作为占位符，避免和代码内容冲突
  const M = { kw: '\x01', fn: '\x02', str: '\x03', num: '\x04', cm: '\x05' };

  let result = code;

  // 1. 注释（#开头到行尾）
  result = result.replace(/(#.*)$/gm, (m, c) => M.cm + c + M.cm);

  // 2. 字符串（必须在其他模式之前，防止内部内容被误匹配）
  result = result.replace(/(['"])(?:(?!\1|\\).|\\.)*\1/g, (m) => M.str + m + M.str);

  // 3. 关键字（优先于函数调用，真正的 Python 关键字）
  result = result.replace(/\b(def|class|if|else|elif|for|while|in|import|from|return|and|or|not|as|with|try|except|finally|raise|lambda|yield|pass|break|continue|is|global|nonlocal|del|assert|True|False|None)\b/g, (m) => M.kw + m + M.kw);

  // 4. 函数调用 identifier(（print/range/len 等内置函数）
  result = result.replace(/\b([a-zA-Z_]\w*)(?=\()/g, (m, n) => M.fn + n + M.fn);

  // 5. 数字
  result = result.replace(/\b(\d+\.?\d*)\b/g, (m) => M.num + m + M.num);

  // 6. HTML 转义（此时没有 HTML 标签，安全）
  result = escapeHTML(result);

  // 7. 替换占位符为实际 <span> 标签
  result = result
    .replace(new RegExp(M.kw + '(.*?)' + M.kw, 'g'), '<span class="kw">$1</span>')
    .replace(new RegExp(M.fn + '(.*?)' + M.fn, 'g'), '<span class="fn">$1</span>')
    .replace(new RegExp(M.str + '(.*?)' + M.str, 'g'), '<span class="str">$1</span>')
    .replace(new RegExp(M.num + '(.*?)' + M.num, 'g'), '<span class="num">$1</span>')
    .replace(new RegExp(M.cm + '(.*?)' + M.cm, 'g'), '<span class="cm">$1</span>');

  return result;
}

/* ===== Python 代码自动缩进（修复数据源缩进丢失） ===== */
function autoIndentPython(codeText) {
  if (!codeText || !codeText.trim()) return codeText;
  const lines = codeText.split('\n');
  // 有任意行已有缩进则跳过
  const hasIndent = lines.some(l => l.length > 0 && (l[0] === ' ' || l[0] === '\t'));
  if (hasIndent) return codeText;

  let indent = 0;
  const INDENT = 4;
  return lines.map(line => {
    const t = line.trim();
    if (!t) return '';
    // else/elif/except/finally 回退到同级
    if (/^(else|elif|except|finally)\b/.test(t)) indent = Math.max(0, indent - 1);
    const out = ' '.repeat(indent * INDENT) + t;
    // : 结尾的块开头（排除切片和字符串）
    if (t.endsWith(':') && !/^\d+:/.test(t)) indent++;
    return out;
  }).join('\n');
}

/* ===== HTML 转义 ===== */
function escapeHTML(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

/* ===== 导航 ===== */
function nextQuestion() {
  if (currentIndex < questionPool.length - 1) {
    currentIndex++;
    renderQuestion();
    const qc = document.querySelector('.qc');
    if (qc) qc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
    const qc = document.querySelector('.qc');
    if (qc) qc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ===== 快速点击（移动端 300ms 延迟优化） ===== */
(function() {
  let target = null, startX = 0, startY = 0;
  const CLICKABLE = ['BUTTON', 'A'];
  document.addEventListener('touchstart', e => {
    target = e.target;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, true);
  document.addEventListener('touchend', e => {
    if (!target) return;
    const tag = target.tagName;
    const cls = target.className || '';
    const isClickable = CLICKABLE.includes(tag) ||
      cls.includes('oi') || cls.includes('jb') || cls.includes('chi');
    if (isClickable) {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        e.preventDefault();
        target.click();
      }
    }
    target = null;
  }, true);
})();

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', e => {
  if (!questionPool.length) return;
  // 输入框聚焦时禁用所有快捷键
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  const i = currentIndex;
  const q = questionPool[i];
  const answered = i in questionAnswered;

  if (e.key === 'ArrowRight' || e.key === 'n') { e.preventDefault(); nextQuestion(); }
  if (e.key === 'ArrowLeft' || e.key === 'p') { e.preventDefault(); prevQuestion(); }

  if (!answered) {
    const k = e.key.toUpperCase();
    if ('ABCDE'.includes(k) && (q.type === '单选题' || q.type === '多选题')) { e.preventDefault(); answerQuestion(i, k); }
    if (e.key === 'Enter' && q.type === '多选题') { e.preventDefault(); submitMulti(i); }
    if (q.type === '判断题') {
      if (k === 'A' || e.key === '1') { e.preventDefault(); answerQuestion(i, '√'); }
      if (k === 'B' || e.key === '0') { e.preventDefault(); answerQuestion(i, 'X'); }
    }
  }
});
